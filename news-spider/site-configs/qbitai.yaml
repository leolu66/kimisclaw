# 量子位 - AI 科技媒体
# https://www.qbitai.com

_schema_version: "1.0"

site:
  name: "量子位"
  base_url: "https://www.qbitai.com"
  enabled: true
  config_version: "2024-03-09-v1"
  
  request:
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    timeout: 30
    delay: 2

list_page:
  url: "https://www.qbitai.com"
  pagination: "https://www.qbitai.com/page/{page}"
  page_start: 1
  page_max: 3
  
  item_selector:
    type: "css"
    value: "article.post"
  
  fields:
    link:
      type: "css"
      value: "h2.entry-title a::attr(href)"
      transform: "absolute_url"
    
    publish_time:
      type: "css"
      value: "time::attr(datetime)"
      transform: "parse_datetime"

detail_page:
  fields:
    title:
      type: "css"
      value: "h1.entry-title::text"
      required: true
    
    summary:
      type: "css"
      value: "div.entry-summary p::text"
      default: ""
    
    author:
      type: "css"
      value: "span.author-name::text"
      default: "量子位"
    
    publish_time:
      type: "css"
      value: "time::attr(datetime)"
      transform: "parse_datetime"
    
    content:
      type: "css"
      value: "div.entry-content"

dedup:
  field: "url"
  method: "url_normalize"
